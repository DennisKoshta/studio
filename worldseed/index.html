<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2b241c" />
    <title>Worldseed</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%234f7f99'/%3E%3Cpath d='M9 19c3-6 8-9 14-8-2 5-6 9-14 8z' fill='%23b3c46c'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/main-BIJ-RGbo.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/store-BPhHkUgA.js">
    <link rel="stylesheet" crossorigin href="./assets/main-DOKrRyXp.css">
  </head>
  <body>
    <header id="top">
      <div class="brand"><span class="logo"></span><div><h1>Worldseed</h1><p>Change one thing about the past. Watch life take a different road.</p></div></div>
      <div id="strip" aria-label="Histories"></div>
      <div class="top-actions">
        <button id="btn-split" class="ghost" title="Show two histories side by side (S)">Split view</button>
        <button id="btn-tree" class="ghost" title="Every species in every history, with ancestry and cousins">Tree of life</button>
        <span class="sound"><button id="btn-sound" class="ghost" aria-pressed="false" title="Procedural sound (off until you turn it on)">Sound: off</button><input id="vol" type="range" min="0" max="1" step="0.05" value="0.6" aria-label="Volume" class="hidden"></span>
        <button id="btn-save" class="ghost" title="Save your histories and journal to a file">Save</button>
        <button id="btn-load" class="ghost" title="Load a saved session">Load</button><input id="load-file" type="file" accept=".json,application/json" class="hidden">
        <button id="btn-rules" class="ghost" title="The rules that shape every creature">Rules of this world</button>
        <button id="btn-help" class="ghost round" title="What is this?">?</button>
      </div>
    </header>
    <main id="main">
      <section id="stage">
        <div id="maps"></div>
        <div id="hovercard" class="card hidden"></div>
        <div id="regioncard" class="card hidden"></div>
        <div id="chronicle" aria-live="polite"></div>
        <div id="captions" class="hidden" aria-live="polite" role="status"></div>
        <div id="follow" class="hidden"></div>
        <div id="mapkey" aria-label="Map key"></div>
      </section>
      <aside id="side">
        <nav id="tabs">
          <button data-tab="life" class="on">Life</button>
          <button data-tab="whatif">What if…</button>
          <button data-tab="cousins">Cousins</button>
          <button data-tab="journal">Journal</button>
        </nav>
        <div id="panel"></div>
        <div id="status-area">
          <div id="toast" class="hidden" role="status"></div>
          <div id="guide"></div>
        </div>
      </aside>
    </main>
    <footer id="bottom">
      <button id="btn-play" class="play" title="Play / pause (Space)" aria-label="Play">▶</button>
      <div id="readout"><span class="lbl">Epoch</span><b id="epoch">0</b><span id="years"></span></div>
      <div id="timeline"></div>
    </footer>
    <div id="overlay" class="hidden"></div>
    <div id="modal" class="hidden"></div>
  </body>
</html>
